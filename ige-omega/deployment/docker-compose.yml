services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ige
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ige
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ige -d ige"]
      interval: 5s
      timeout: 3s
      retries: 15
  gateway:
    build: {context: .., dockerfile: deployment/Dockerfile.gateway}
    environment:
      DATABASE_URL: postgres://ige:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/ige
      IGE_API_TOKENS: ${IGE_API_TOKENS:?Set IGE_API_TOKENS in environment}
      RUST_LOG: ${RUST_LOG:-info}
      IGE_RATE_LIMIT_PER_MINUTE: ${IGE_RATE_LIMIT_PER_MINUTE:-120}
      IGE_BIND: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  pgdata:
