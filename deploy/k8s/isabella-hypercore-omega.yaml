## Router — ingress único al skill fabric

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isabella-hypercore-router
  namespace: isabella-hypercore
  labels:
    app.kubernetes.io/name: isabella-hypercore-router
    app.kubernetes.io/part-of: isabella-tina-h7
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isabella-hypercore-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isabella-hypercore-router
        app.kubernetes.io/part-of: isabella-tina-h7
    spec:
      serviceAccountName: hypercore-router-sa
      automountServiceAccountToken: false
      priorityClassName: hypercore-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: isabella-hypercore-router
      containers:
        - name: hypercore-router
          image: ghcr.io/tamv/isabella-hypercore-router:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BOOKPI_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: isabella-runtime-config
                  key: BOOKPI_ENDPOINT
            - name: CROWN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: isabella-runtime-config
                  key: CROWN_ENDPOINT
            - name: MCP_REGISTRY_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: isabella-runtime-config
                  key: MCP_REGISTRY_ENDPOINT
            - name: POLICY_VERSION
              valueFrom:
                configMapKeyRef:
                  name: isabella-runtime-config
                  key: POLICY_VERSION
            - name: HYPERCORE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: isabella-hypercore-signing
                  key: HYPERCORE_SIGNING_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
***
apiVersion: v1
kind: Service
metadata:
  name: isabella-hypercore-router
  namespace: isabella-hypercore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: isabella-hypercore-router
  ports:
    - name: http
      port: 80
      targetPort: 8080
***
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: isabella-hypercore-router
  namespace: isabella-hypercore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: isabella-hypercore-router
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
***
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: isabella-hypercore-router
  namespace: isabella-hypercore
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: isabella-hypercore-router
***
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: isabella-hypercore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
***
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypercore-router-policy
  namespace: isabella-hypercore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: isabella-hypercore-router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: isabella-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: isabella-bookpi
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: isabella-crown
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: isabella-skill
      ports:
        - protocol: TCP
          port: 8080
```

