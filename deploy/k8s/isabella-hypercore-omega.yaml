# ISABELLA HYPERCORE Ω — Distributed Skill Execution Runtime (TINA-h7)

> **Estado:** draft | engine-generated — not applied to any cluster by this repo.  
> **Alcance:** Runtime distribuido de ejecución de skills para Isabella Ω∞ / TAMV.  
> **Principios:** un pod ejecuta una capacidad; NetworkPolicies segmentan cada skill; cada workload declara startup, readiness y liveness probes, HPA y PDB; ningún contenedor corre como root ni tiene filesystem raíz escribible.

