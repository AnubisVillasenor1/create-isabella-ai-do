[project]
name = "latam-aegis-x"
version = "0.1.0"
description = "Adaptive defense fabric for Isabella AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "cryptography>=42.0",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.1",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
quantum = [
  "qiskit>=2.3",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.40",
  "qiskit-ibm-catalog>=0.2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
