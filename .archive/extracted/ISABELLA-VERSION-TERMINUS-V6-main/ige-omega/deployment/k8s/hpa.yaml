apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ige-omega-gateway
  namespace: isabella-ige-omega
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ige-omega-gateway}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
