[workspace]
resolver = "2"
members = ["crates/shared","crates/neurokernel","crates/cognition","crates/memory","crates/worldmodel","crates/abx","crates/bookpix","services/gateway"]
[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
[workspace.dependencies]
tokio = { version = "1", features = ["macros","rt-multi-thread","net","signal","sync","time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4","v7","serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls","postgres","uuid","chrono","json","migrate","macros"] }
dotenvy = "0.15"
sha2 = "0.10"
futures-util = "0.3"
shared = { path = "crates/shared" }
neurokernel = { path = "crates/neurokernel" }
cognition = { path = "crates/cognition" }
memory = { path = "crates/memory" }
worldmodel = { path = "crates/worldmodel" }
abx = { path = "crates/abx" }
bookpix = { path = "crates/bookpix" }
