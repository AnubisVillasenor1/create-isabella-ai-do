          # no bloquear pods por dependencias externas aún no verificadas; apuntar
          # a /api/v1/healthz cuando el Secret y los adaptadores estén listos.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ISA-363 (P1): valores iniciales conservadores.
