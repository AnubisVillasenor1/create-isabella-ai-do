apiVersion: apps/v1
kind: Deployment
metadata:
  name: isabella-genesis
  namespace: isabella-genesis
  labels:
    app.kubernetes.io/name: isabella-genesisai
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: tamv
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: isabella-genesis
  template:
    metadata:
      labels:
        app: isabella-genesis
        deployment: isabella-genesis
    spec:
      serviceAccountName: isabella-genesis
      automountServiceAccountToken: false
      priorityClassName: isabella-genesis-critical
      # ISA-366: seguridad a nivel de pod.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # ISA-367: perfil seccomp. Verificar aplicación real en runtime (RV).
        seccompProfile:
          type: RuntimeDefault
      # ISA-364: repartir réplicas entre nodos (dominios de fallo).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: isabella-genesis
      containers:
        - name: runtime
          # ISA-355 (P0): reemplazar tag por digest inmutable.
          #   BLOCKED_ENVIRONMENT -> registry real del cliente (ECR/Harbor/GHCR).
          #   Sustituir por:  <REGISTRY_REAL>/<REPO>@sha256:<DIGEST_RESUELTO>
          #   imagePullPolicy: IfNotPresent mientras se resuelve el digest.
          image: ghcr.io/tamv-online/isabella-genesisai:v40.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          # ISA-362 (P0): SOLO referencias. Nunca valores literales en el repo.
          # El Secret lo aprovisiona un gestor externo (KMS / External Secrets /
          # Sealed Secrets). Ver k8s/sealed-secret-example.yaml y docs/deployment/README.md.
          envFrom:
            - secretRef:
                name: isabella-genesis-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # ISA-357 (P2): liveness independiente de caídas de dependencias externas.
          # /health es un endpoint estático (src/server.ts:378).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # ISA-356 (P1): readiness contra endpoint público verificado
