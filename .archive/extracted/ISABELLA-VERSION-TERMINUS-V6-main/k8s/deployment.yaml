            privileged: false
            # Verificado: el runtime no escribe en disco (BookPI usa el ledger
            # en memoria; solo lee src/styles/crystal-clear.css). Ver README.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
