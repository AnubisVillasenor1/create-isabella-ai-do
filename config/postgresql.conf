# PostgreSQL 16 Production Configuration for ISABELLA GENESIS ZERO-OPEX v3
# Optimized for OCI Ampere A1 (ARM64) - 4 vCPUs, 24 GB RAM, 200 GB SSD

# ------------------------------------------------------------------------------
# CONNECTIONS & AUTHENTICATION
# ------------------------------------------------------------------------------

max_connections = 200
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'
listen_addresses = '*'
port = 5432

# ------------------------------------------------------------------------------
# MEMORY & CACHING
# ------------------------------------------------------------------------------

# 4GB shared_buffers - 1/6 of 24GB RAM (recommended for dedicated DB server)
shared_buffers = 4GB

# Effective cache size for planner - 50% of RAM
effective_cache_size = 12GB

# Work memory per operation (sort, hash, etc.) - conservative for concurrent connections
work_mem = 32MB

# Maintenance work memory for VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 1GB

# Huge pages for better TLB performance on large memory
huge_pages = try

# ------------------------------------------------------------------------------
# WAL & CHECKPOINTING
# ------------------------------------------------------------------------------

# WAL buffers - auto-tuned from shared_buffers
wal_buffers = 64MB

# Checkpoint tuning for high-write workloads
min_wal_size = 2GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
checkpoint_warning = 30s

# WAL compression for reduced I/O
wal_compression = on

# ------------------------------------------------------------------------------
# QUERY PLANNER & OPTIMIZER
# ------------------------------------------------------------------------------

# SSD-optimized random page cost
random_page_cost = 1.1
seq_page_cost = 1.0

# CPU cost estimates
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Effective I/O concurrency for NVMe/SSD
effective_io_concurrency = 200

# Parallel query settings
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# ------------------------------------------------------------------------------
# AUTOVACUUM & STATISTICS
# ------------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = 2ms

# Statistics
default_statistics_target = 100
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------

log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ------------------------------------------------------------------------------
# EXTENSIONS & MODULES
# ------------------------------------------------------------------------------

shared_preload_libraries = 'pg_stat_statements, pgmq, auto_explain, age'

# pg_stat_statements
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

# auto_explain
auto_explain.log_min_duration = 1000
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_format = 'json'
auto_explain.log_nested_statements = on

# ------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# ------------------------------------------------------------------------------

default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'
statement_timeout = 30000
lock_timeout = 10000
idle_in_transaction_session_timeout = 60000

# ------------------------------------------------------------------------------
# UTF-8 & LOCALE
# ------------------------------------------------------------------------------

lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ------------------------------------------------------------------------------
# SECURITY & ENCRYPTION
# ------------------------------------------------------------------------------

password_encryption = scram-sha-256
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_ciphers = 'HIGH:!aNULL:!3DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA'
ssl_prefer_server_ciphers = on

# ------------------------------------------------------------------------------
# REPLICATION (for future HA)
# ------------------------------------------------------------------------------

# wal_level = replica
# max_wal_senders = 10
# max_replication_slots = 10
# hot_standby = on
# hot_standby_feedback = on

# ------------------------------------------------------------------------------
# EXTENSION-SPECIFIC SETTINGS
# ------------------------------------------------------------------------------

# pg_stat_statements
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

# pgmq
pgmq.partition_interval = '1 day'
pgmq.retention_interval = '30 days'

# auto_explain
auto_explain.log_min_duration = 1000
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on

# Apache AGE
# age.allow_client_auth = on

# ------------------------------------------------------------------------------
# PARALLELISM FOR ARM64 (OCI Ampere)
# ------------------------------------------------------------------------------

# ARM64 optimizations
# Note: These are set conservatively for 4 vCPUs
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# ------------------------------------------------------------------------------
# MONITORING & ALERTING THRESHOLDS
# ------------------------------------------------------------------------------

# Log slow queries > 1s
log_min_duration_statement = 1000

# Track temp files
log_temp_files = 0

# ------------------------------------------------------------------------------
# CUSTOM SETTINGS FOR ISABELLA
# ------------------------------------------------------------------------------

# Application name for connection tracking
application_name = 'isabella-core'

# Timezone
timezone = 'UTC'

# Date style
datestyle = 'iso, mdy'

# Interval style
intervalstyle = 'postgres'

# ------------------------------------------------------------------------------
# END OF CONFIGURATION
# ------------------------------------------------------------------------------